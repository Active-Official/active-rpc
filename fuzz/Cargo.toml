[package]
name = "active-rpc-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
# The wasm target needs the interpreter; the feature is crate-wide, which only
# makes the other targets build a little slower.
active-rpc = { path = "..", default-features = false, features = ["wasm-tools", "quic", "http2"] }

[[bin]]
name = "fuzz_arp1_frame"
path = "fuzz_targets/fuzz_arp1_frame.rs"
test = false
doc = false
bench = false


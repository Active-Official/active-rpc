[package]
name = "active-rpc-fuzz"
version = "0.0.0"
# The fuzz crate is unpublished, but the license field is required: without
# it cargo-deny flags the crate itself as unlicensed (R2-SUPPLY-02).
license = "MIT OR Apache-2.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
# The wasm target needs the interpreter; the feature is crate-wide, which only
# makes the other targets build a little slower.
# The version pins the requirement: a bare path dependency is an implicit
# '*' wildcard, which the bans policy denies (R2-SUPPLY-02).
active-rpc = { path = "..", version = "2.3.0", default-features = false, features = ["wasm-tools", "quic", "http2"] }
# The positive controls build a canonical image (domain target) and wrap a
# replay body in its checksum so mutations reach the body parser.
active-infinity = "2.4.0"
blake3 = "1.5"
# The QUIC handshake target forges certificates and keys from mutated bytes,
# so it names the DER types directly instead of borrowing them through quinn.
rustls-pki-types = "1"

[[bin]]
name = "fuzz_arp1_frame"
path = "fuzz_targets/fuzz_arp1_frame.rs"
test = false
doc = false
bench = false


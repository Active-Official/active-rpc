[package]
name = "active-rpc-cli"
version = "0.3.1"
edition = "2021"
rust-version = "1.88"
authors = ["Active Language Team"]
license = "MIT OR Apache-2.0"
description = "Production CLI for Active RPC: peer, call, pipeline, loadgen, bridge, events and doctor"
repository = "https://github.com/Active-Official/active-rpc"
homepage = "https://github.com/Active-Official/active-rpc"
documentation = "https://docs.rs/active-rpc-cli"
readme = "README.md"
keywords = ["active", "rpc", "cli", "capability", "agents"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
active-rpc = { path = "../..", version = "2.3.0", features = ["quic", "http2"] }
serde_json = "1"
rustls-pki-types = "1"

[target.'cfg(windows)'.dependencies]
# The receipt-key permission check is a DACL check on Windows (XPL-RPC-09):
# the mode check is unix-only, so the ACL probe lives in a one-function
# helper crate with a safe API instead of a carve-out here (same shape as
# the file-identity helper the root crate uses for the receipt lock).
active-rpc-key-acl = { path = "../../key-acl", version = "0.1.0" }

[[bin]]
name = "active-rpc-cli"
path = "src/main.rs"

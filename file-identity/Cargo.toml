[package]
name = "active-rpc-file-identity"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
authors = ["Active Language Team"]
license = "MIT OR Apache-2.0"
description = "One OS primitive for Active RPC: the stable identity of an open file on Windows (volume serial + file index), so receipt-lock ownership is the file, not its copyable text"
repository = "https://github.com/Active-Official/active-rpc"
homepage = "https://github.com/Active-Official/active-rpc"
publish = false

[lib]
name = "active_rpc_file_identity"
path = "src/lib.rs"

[target.'cfg(windows)'.dependencies]
# Already in the root lockfile (transitive via tokio/mio): no new registry
# crate enters the graph (XPL-RPC-08). The API paths were verified in the
# vendored windows-sys 0.61.2 source before this crate was written:
# `GetFileInformationByHandle` and `BY_HANDLE_FILE_INFORMATION` live in
# `Win32::Storage::FileSystem`, gated on `Win32_Storage_FileSystem`;
# `HANDLE` and `BOOL` live in `Win32::Foundation`.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

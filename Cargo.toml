[package]
name = "active-rpc"
version = "2.3.0"
edition = "2021"
rust-version = "1.88"
authors = ["Active Language Team"]
license = "MIT OR Apache-2.0"
description = "Active RPC — capability-based, promise-pipelined, multi-lane RPC for Active Infinity payloads and multi-agent systems"
repository = "https://github.com/Active-Official/active-rpc"
homepage = "https://github.com/Active-Official/active-rpc"
documentation = "https://docs.rs/active-rpc"
readme = "README.md"
keywords = ["active", "rpc", "capability", "agents", "pipelining"]
categories = ["network-programming", "asynchronous", "config"]
exclude = [
    "facades/**",
    "target/**",
    "fuzz/corpus/**",
    "fuzz/artifacts/**",
    "fuzz/target/**",
]

[features]
default = ["quic", "http-tls"]
# Real QUIC transport over loopback (quinn + rustls).
quic = ["dep:quinn", "dep:rustls", "dep:rcgen", "dep:tokio"]
# TLS for the HTTP tool provider: `https://` bases with operator-pinned
# roots, via the same rustls stack the QUIC transport already uses (RPC-38).
http-tls = ["dep:rustls"]
# Native HTTP/2 transport carrying raw ARP1 envelopes.
http2 = ["dep:h2", "dep:http", "dep:bytes", "dep:tokio"]
# Fuel-metered WebAssembly guest tools under capability control.
wasm-tools = ["dep:wasmi", "dep:wat"]
# Test-only identities (RPC-55): `PeerIdentity::from_certificate_for_test`
# builds a verified identity from raw bytes so the kernel's binding tests can
# build admitted peers without a live transport. NEVER enable in a shipped
# build: it re-opens RPC-55 by letting any caller mint a bindable identity for
# any fingerprint. CI covers it through --all-features; the full local suite
# needs `cargo test --features test-utils`.
test-utils = []

[dependencies]
active-infinity = "2.4.0"
active-core = { version = "1.4.0" }
# The tool adapters' Windows children run in a job object so a timeout kill
# ends the whole tree (XPL-RPC-04): the FFI lives in a one-purpose helper
# crate with a safe API, since this crate forbids `unsafe` (same shape as
# the liveness helper below).
active-rpc-process-tree = { path = "process-tree", version = "0.1.0" }
# `sync_parent` is a directory flush on every OS (XPL-RPC-12): Windows has
# no `File::open(dir).sync_all()` — the directory handle needs
# `FILE_FLAG_BACKUP_SEMANTICS` + `FlushFileBuffers` — and this crate forbids
# `unsafe`, so the call lives in a one-function helper crate with a safe API
# instead of a carve-out here (same shape as liveness).
active-rpc-dir-sync = { path = "dir-sync", version = "0.1.0" }
thiserror = "1.0"
blake3 = "1.5"
getrandom = "0.3"
# `preserve_order` is what the durable record's canonical text depends on: the
# writer emits its fields in a fixed order and the parser re-renders that exact
# text, so a transitive change to this feature would rewrite every record's
# canonical form (DeepSeek F-3). Declared here so the dependency is explicit.
serde_json = { version = "1.0", features = ["preserve_order"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "macros", "sync"], optional = true }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"], optional = true }
rcgen = { version = "0.13", optional = true }
h2 = { version = "0.4", optional = true }
http = { version = "1", optional = true }
bytes = { version = "1", optional = true }
wasmi = { version = "2", optional = true }
# Only for the `accept_wat` policy: text is parsed to binary so the module
# ceiling bounds what the engine actually compiles (R-14 round 3, L-5).
wat = { version = "1", optional = true }

[target.'cfg(unix)'.dependencies]
# `O_NOFOLLOW` for the receipt log's write and read opens: the path is checked
# and then opened, and the open is the only step that can be made atomic
# (R-13 round 12, F3).
libc = "0.2"

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
# The receipt log's steal rule needs pid liveness on every OS (XPL-RPC-02):
# Windows has no /proc, and macOS has no /proc either. The probe is one FFI
# call per platform, and this crate forbids `unsafe`, so the call lives in a
# one-function helper crate with a safe API instead of a carve-out here.
active-rpc-liveness = { path = "process-liveness", version = "0.1.0" }

[target.'cfg(windows)'.dependencies]
# The receipt lock's ownership proof is a file identity on Windows
# (XPL-RPC-08): the nonce is copyable plaintext, so `still_holds` must
# compare the held handle against the path by file index + volume serial.
# The probe is one FFI call, and this crate forbids `unsafe`, so the call
# lives in a one-function helper crate with a safe API instead of a
# carve-out here (same shape as liveness).
active-rpc-file-identity = { path = "file-identity", version = "0.1.0" }

[dev-dependencies]
proptest = "1"
sha2 = "0.10"
criterion = "0.5"
prost = "0.13"
# The wasm tests assemble their WAT fixtures into binary modules: the sandbox
# refuses text by default, and a peer only ever sends binary.
wat = "1"
# The TLS tests mint a test CA and leaf at runtime, so no test-only private
# key is committed (RPC-38). `rcgen` is already an optional dependency
# (behind `quic`); the dev-dependency makes it available to the tests
# whatever features are enabled.
rcgen = "0.13"
# The RPC-57 expiry test mints short-lived certificates (`not_after` a few
# seconds out), so it needs `OffsetDateTime` directly. `time` is already in
# the lockfile (0.3.55) via `rcgen`, so this only adds the dev-dependency edge.
time = "0.3"

[[bin]]
name = "active-rpc-peer"
path = "src/bin/peer.rs"

[[bench]]
name = "transport"
harness = false

[[bench]]
name = "bakeoff"
harness = false

[[bench]]
name = "domain"
harness = false

[lib]
name = "active_rpc"
path = "src/lib.rs"

[[test]]
name = "unit_tests"
path = "tests/unit_tests.rs"

[[test]]
name = "integration_tests"
path = "tests/integration_tests.rs"

[[test]]
name = "concurrency_tests"
path = "tests/concurrency_tests.rs"

[[test]]
name = "conformance_tests"
path = "tests/conformance_tests.rs"

[[test]]
name = "redteam_tests"
path = "tests/redteam_tests.rs"

[[test]]
name = "redteam_battery"
path = "tests/redteam_battery.rs"

[[test]]
name = "perf_budget"
path = "tests/perf_budget.rs"

[[test]]
name = "doc_gate"
path = "tests/doc_gate.rs"

[[test]]
name = "property_tests"
path = "tests/property_tests.rs"

[[test]]
name = "identity_tests"
path = "tests/identity_tests.rs"

[[test]]
name = "http2_tests"
path = "tests/http2_tests.rs"

[[test]]
name = "bulk_tests"
path = "tests/bulk_tests.rs"

[[test]]
name = "observability_tests"
path = "tests/observability_tests.rs"

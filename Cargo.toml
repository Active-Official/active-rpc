[package]
name = "active-rpc"
version = "1.1.5"
edition = "2021"
rust-version = "1.88"
authors = ["Active Language Team"]
license = "MIT OR Apache-2.0"
description = "Active RPC — capability-based, promise-pipelined, multi-lane RPC for Active Infinity payloads and multi-agent systems"
repository = "https://github.com/Active-Official/active-rpc"
homepage = "https://github.com/Active-Official/active-rpc"
documentation = "https://docs.rs/active-rpc"
readme = "README.md"
keywords = ["active", "rpc", "capability", "agents", "pipelining"]
categories = ["network-programming", "asynchronous", "config"]
exclude = [
    "target/**",
    "fuzz/corpus/**",
    "fuzz/artifacts/**",
    "fuzz/target/**",
]

[features]
default = ["quic"]
# Real QUIC transport over loopback (quinn + rustls).
quic = ["dep:quinn", "dep:rustls", "dep:rcgen", "dep:tokio"]

[dependencies]
active-infinity = "1.2.0"
active-core = { version = "1.4.0" }
thiserror = "1.0"
blake3 = "1.5"
getrandom = "0.3"
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "macros", "sync"], optional = true }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"], optional = true }
rcgen = { version = "0.13", optional = true }

[dev-dependencies]
proptest = "1"
criterion = "0.5"

[[bin]]
name = "active-rpc-peer"
path = "src/bin/peer.rs"

[[bench]]
name = "transport"
harness = false

[lib]
name = "active_rpc"
path = "src/lib.rs"

[[test]]
name = "unit_tests"
path = "tests/unit_tests.rs"

[[test]]
name = "integration_tests"
path = "tests/integration_tests.rs"

[[test]]
name = "concurrency_tests"
path = "tests/concurrency_tests.rs"

[[test]]
name = "conformance_tests"
path = "tests/conformance_tests.rs"

[[test]]
name = "redteam_tests"
path = "tests/redteam_tests.rs"

[[test]]
name = "property_tests"
path = "tests/property_tests.rs"
[package]
name = "active-rpc-tools"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
authors = ["Active Language Team"]
license = "MIT OR Apache-2.0"
description = "Tool adapters for active-rpc: MCP, HTTP and sandboxed local processes"
repository = "https://github.com/Active-Official/active-rpc"
homepage = "https://github.com/Active-Official/active-rpc"
documentation = "https://docs.rs/active-rpc-tools"
readme = "README.md"
keywords = ["active", "rpc", "tools", "mcp", "http"]
categories = ["network-programming", "asynchronous"]


[dependencies]
active-rpc = { version = "2.0.0", default-features = false }

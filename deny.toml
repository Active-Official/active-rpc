[advisories]
# `unsafe-libyaml` (via active-core → serde_yaml) is unmaintained upstream; it is
# not in this crate's parsing path. See the Infinity ADR-0008.
ignore = ["RUSTSEC-2024-0449"]

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "CC0-1.0"]
# The allowance list is deliberately wider than the current graph (feature and
# platform combinations pull different crates), so an unused entry is not a
# finding.
unused-allowed-license = "allow"

[bans]
multiple-versions = "allow"
wildcards = "deny"
deny = [
    { name = "md5" },
    # sha1 is banned EXCEPT as the RFC 6455 WebSocket handshake hash
    # (Sec-WebSocket-Accept = base64(SHA-1(key + GUID))): the hash is
    # protocol-mandated, not a cryptographic choice, and is never used for
    # signatures, secrets, or integrity decisions in this repo. The
    # `wrappers` list scopes the exemption by provenance: only axum and
    # tungstenite (the crates that perform the handshake) may bring sha1
    # in. Any other path to sha1 is still banned. R2-SUPPLY-02.
    { name = "sha1", wrappers = ["axum", "tungstenite"] },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[graph]
all-features = true

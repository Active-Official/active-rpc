[[invariants]]
id = "I-1"
title = "Structural secret taint"
status = "covered"
checks = [
  "test:tests/redteam_tests.rs::threat_secret_material_never_reaches_the_wire",
  "test:tests/redteam_tests.rs::review_module_payloads_are_redacted",
  "test:tests/integration_tests.rs::redaction_hides_the_secret_cone",
]
note = "RPC carries Infinity modules; redaction is enforced before a module payload leaves the kernel. The taint itself lives in active-infinity."

[[invariants]]
id = "I-2"
title = "Anti-oracle equality"
status = "n/a"
note = "Value::Secret and SecretBytes live in active-infinity; the RPC layer never compares secret values. The Infinity map owns the control."

[[invariants]]
id = "I-3"
title = "Secret non-leakage"
status = "covered"
critical = true
checks = [
  "test:tests/redteam_tests.rs::threat_secret_material_never_reaches_the_wire",
  "test:tests/redteam_tests.rs::review_module_payloads_are_redacted",
  "test:tests/integration_tests.rs::redaction_hides_the_secret_cone",
  "test:tests/unit_tests.rs::response_and_error_envelopes_carry_no_payload",
  "fuzz:fuzz_arp1_frame",
]
negative_control_status = "implemented"
negative_control_check = "script:scripts/negative_controls.py#I-3-redaction"
negative_control_probe = "Make Kernel::redact_module_payload a no-op and run the redaction tests"
negative_control_expected = "threat_secret_material_never_reaches_the_wire must fail with the canary bytes present in the encoded envelope"
note = "Wire-level redaction plus Infinity redaction. H2 adds the scripted probe."

[[invariants]]

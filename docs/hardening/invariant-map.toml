]
negative_control_status = "implemented"
negative_control_check = "script:scripts/negative_controls.py#I-5-attenuation"
negative_control_probe = "Allow attenuation to union parent and child method lists and run the monotonicity property and the escalation test"
negative_control_expected = "attenuation_is_monotone and threat_escalation_through_metadata must fail on a child that widens the parent"
note = "Methods, budget, path and tool policy all narrow; a zero ceiling is refused."


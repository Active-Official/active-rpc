  "test:tests/unit_tests.rs::unknown_method_is_refused",
]
negative_control_status = "implemented"
negative_control_check = "script:scripts/negative_controls.py#I-4-secret"
negative_control_probe = "Replace the OS CSPRNG in Agent::new with a fixed seed and mint two agents"
negative_control_expected = "review_agent_secrets_are_random must fail because both agents produce the same capability ids"
note = "Capability ids are Blake3(secret, serial, parent)[..16]; the secret is 32 CSPRNG bytes."

[[invariants]]

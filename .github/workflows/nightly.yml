name: Nightly fuzz

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  fuzz:
    runs-on: ubuntu-latest
    # A slow target must not eat the six-hour default: the campaign is bounded
    # per target and the job is bounded overall.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        target:
          - fuzz_arp1_frame
          - fuzz_capability_lifecycle
          - fuzz_promise_graph
          - fuzz_budget_matrix
          - fuzz_tool_mcp
          - fuzz_tool_http
          - fuzz_tool_process
          - fuzz_channel_cap_transfer
          - fuzz_transport_framing
          - fuzz_bulk_plan
          - fuzz_replay_package
          - fuzz_topic_policy
          - fuzz_receipt_log
          - fuzz_wasm_module
          - fuzz_domain_module
          - fuzz_persistence_record
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - name: Install clang (libFuzzer runtime)
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Long campaign
        run: cargo fuzz run "${{ matrix.target }}" -- -runs=200000 -max_len=65536 -print_final_stats=1
      # A crash input is the only thing that makes a nightly failure
      # reproducible: `fuzz/artifacts` is gitignored, so without this step the
      # artifact dies with the runner.
      - name: Upload artifacts and corpus
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-${{ matrix.target }}
          path: |
            fuzz/artifacts
            fuzz/corpus
          if-no-files-found: ignore

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked
      - name: Coverage floor
        run: |
          cargo llvm-cov --locked --all-features --json --summary-only --output-path coverage.json
          python3 scripts/coverage_gate.py coverage.json

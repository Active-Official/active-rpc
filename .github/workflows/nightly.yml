name: Nightly fuzz

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.list.outputs.targets }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Read the target list from the manifest
        id: list
        run: |
          targets=$(python3 - <<'PY'
          import json, pathlib, re
          text = pathlib.Path("fuzz/Cargo.toml").read_text()
          names = re.findall(r'^name = "(fuzz_[a-z0-9_]+)"$', text, re.MULTILINE)
          print(json.dumps(names))
          PY
          )
          if [ -z "$targets" ] || [ "$targets" = "[]" ]; then
            echo "no fuzz targets found in fuzz/Cargo.toml"
            exit 1
          fi
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

  fuzz:
    needs: plan
    runs-on: ubuntu-latest
    # A slow target must not eat the six-hour default: the campaign is bounded
    # per target and the job is bounded overall.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # Derived from the manifest: a hand-copied list drifts (R-20 L6/L7).
        target: ${{ fromJSON(needs.plan.outputs.targets) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@nightly
      - name: Install clang (libFuzzer runtime)
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Install cargo-fuzz
        # Pinned: an unpinned third-party install runs arbitrary new code every
        # night with the job token (R-20 round 4, #4).
        run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Long campaign
        run: cargo fuzz run "${{ matrix.target }}" -- -runs=200000 -max_len=65536 -print_final_stats=1
      # A crash input is the only thing that makes a nightly failure
      # reproducible: `fuzz/artifacts` is gitignored, so without this step the
      # artifact dies with the runner.
      - name: Upload artifacts and corpus
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: fuzz-${{ matrix.target }}
          path: |
            fuzz/artifacts
            fuzz/corpus
          if-no-files-found: ignore

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-llvm-cov
        # Pinned for the same reason as cargo-fuzz.
        run: cargo install cargo-llvm-cov --version 0.6.19 --locked
      - name: Coverage floor
        run: |
          cargo llvm-cov --locked --all-features --json --summary-only --output-path coverage.json
          python3 scripts/coverage_gate.py coverage.json

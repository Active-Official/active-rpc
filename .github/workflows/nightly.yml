name: Nightly fuzz

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.list.outputs.targets }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Read the target list from the manifest
        id: list
        run: |
          targets=$(python3 - <<'PY'
          import json, pathlib, re
          text = pathlib.Path("fuzz/Cargo.toml").read_text()
          names = re.findall(r'^name = "(fuzz_[a-z0-9_]+)"$', text, re.MULTILINE)
          print(json.dumps(names))
          PY
          )
          if [ -z "$targets" ] || [ "$targets" = "[]" ]; then
            echo "no fuzz targets found in fuzz/Cargo.toml"
            exit 1
          fi
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

  fuzz:
    needs: plan
    runs-on: ubuntu-latest
    # A slow target must not eat the six-hour default: the campaign is bounded
    # per target and the job is bounded overall.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # Derived from the manifest: a hand-copied list drifts (R-20 L6/L7).
        target: ${{ fromJSON(needs.plan.outputs.targets) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@2c76c034f9e32a5d6e2c104dc4df23a22476db04 # nightly, pinned 2026-11-07 (R-20 round 5, F11)
      - name: Install clang (libFuzzer runtime)
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Install cargo-fuzz
        # Pinned: an unpinned third-party install runs arbitrary new code every
        # night with the job token (R-20 round 4, #4).
        run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Long campaign
        # `-max_total_time` bounds the campaign in-process: a cancelled job
        # skips its `always()` upload, so a job-timeout could lose the
        # crashing input the step exists to keep (R-20 round 5, F12).
        run: |
          # The lock must describe the graph the campaign builds (R-20 round 6,
          # finding 9).
          cargo metadata --locked --manifest-path fuzz/Cargo.toml --format-version 1 > /dev/null
          # `-runs` counts the seed corpus, so the budget is the corpus plus the
          # mutation allowance (finding 2).
          seeds=$(find "fuzz/corpus/${{ matrix.target }}" -type f | wc -l)
          cargo fuzz run "${{ matrix.target }}" -- -runs=$((200000 + seeds)) -max_total_time=900 -max_len=65536 -print_final_stats=1
      # A crash input is the only thing that makes a nightly failure
      # reproducible: `fuzz/artifacts` is gitignored, so without this step the
      # artifact dies with the runner.
      - name: Upload the crash input
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: fuzz-${{ matrix.target }}
          path: fuzz/artifacts
          if-no-files-found: ignore
      # The grown corpus is 3 000+ committed seeds plus this run's
      # additions: sixteen of those a night drowns the artifact list, so
      # it is kept only when the run failed (R-20 round 5, F10). The long
      # single-lane campaign in fuzz-nightly.yml keeps the corpus.
      - name: Upload the grown corpus on failure
        if: failure()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: fuzz-corpus-${{ matrix.target }}
          path: fuzz/corpus
          if-no-files-found: ignore

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, pinned 2026-11-07 (R-20 round 5, F11)
      - name: Install cargo-llvm-cov
        # Pinned for the same reason as cargo-fuzz.
        run: cargo install cargo-llvm-cov --version 0.6.19 --locked
      - name: Coverage floor
        # Full JSON, not --summary-only: the per-file floors and the
        # no-new-uncovered-function check in scripts/coverage_gate.py need
        # the `files` and `functions` sections. The test and report phases
        # are split: one failing binary used to stop the run before any
        # report existed, so the gate never ran at all. --no-fail-fast runs
        # every binary; the report is then built from the collected
        # profraw data regardless of test outcomes; the test exit code is
        # kept and re-raised at the end, so a test failure still fails
        # this job (TEST-01).
        run: |
          cargo llvm-cov --locked --all-features --no-fail-fast --no-report || test_exit=$?
          cargo llvm-cov report --json --output-path coverage.json
          python3 scripts/coverage_gate.py coverage.json
          exit ${test_exit:-0}

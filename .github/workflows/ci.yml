name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    env:
      # Two concurrent rustc/link jobs instead of one per core: the runner's
      # lld died with a bus error while linking ~90 test binaries at full
      # parallelism (2026-11-04, twice). The suite is not the bottleneck.
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy (all targets)
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Clippy (no default features)
        run: cargo clippy --locked --all-targets --no-default-features -- -D warnings
      - name: Tests
        run: cargo test --locked --all-features
      - name: Invariant gate (secret canary and capability authority)
        run: cargo test --locked --test invariant_gate
      - name: Tests (no default features)
        run: cargo test --locked --no-default-features
      - name: Documentation
        env:
          # A broken intra-doc link is a documentation defect, not a warning.
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps --all-features
      - name: Benchmarks compile
        run: cargo bench --locked --benches --no-run

  perf-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@stable
      - name: Run the machine-portable perf gate
        run: |
          cargo run --release --locked --quiet --example perf_matrix --all-features > perf-matrix.json
          python3 scripts/perf_gate.py perf-matrix.json
      - name: Upload the matrix
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: perf-matrix
          path: perf-matrix.json

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@1.88.0
      # 1.88 is the floor because the patched `time` (RUSTSEC-2026-0009) and
      # `proptest` 1.12 both require it; see docs/adr/0007-msrv.md.
      - name: MSRV check (every feature, every target)
        run: cargo check --locked --all-targets --all-features
      - name: MSRV check (no default features)
        run: cargo check --locked --all-targets --no-default-features

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@stable
      - name: Package (the tarball must build on its own)
        run: cargo package --locked

  hardening-status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # A stale row, a missing test, or a critical invariant without a
      # negative-control plan fails the build.
      - name: Validate the hardening matrix
        run: python3 scripts/hardening_status.py --check

  negative-controls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@stable
      # A security test that still passes on a broken build proves nothing.
      - name: Every security-critical check must fail on a broken build
        run: python3 scripts/negative_controls.py --check

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # A rolling nightly is deliberate: libFuzzer fixes and sanitizer support
      # land there first. The crate graph is pinned by the committed
      # fuzz/Cargo.lock, which cargo-fuzz uses as-is.
      - uses: dtolnay/rust-toolchain@nightly
      - name: Install clang (libFuzzer runtime)
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked
      # The corpus is committed under fuzz/corpus/<target>/. A short campaign
      # per target on every push and pull request; main and nightly run longer.
      - name: Bounded fuzz campaign (every target)
        run: |
          targets=$(python3 - <<'PY'
          import pathlib, re
          text = pathlib.Path("fuzz/Cargo.toml").read_text()
          print("\n".join(re.findall(r'^name = "(fuzz_[a-z0-9_]+)"$', text, re.MULTILINE)))
          PY
          )
          if [ -z "$targets" ]; then
            echo "no fuzz targets found in fuzz/Cargo.toml"
            exit 1
          fi
          for target in $targets; do
            echo "== $target =="
            # `-max_len` stops libFuzzer spending the budget growing inputs past
            # the size every parser refuses.
            cargo fuzz run "$target" -- -runs=2000 -max_len=65536
          done
      # A crash input is written under fuzz/artifacts, which is gitignored, so
      # without this step the run that found it leaves nothing behind. The
      # nightly lanes upload the same paths.
      - name: Upload artifacts and corpus
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: fuzz-pr
          path: |
            fuzz/artifacts
            fuzz/corpus
          if-no-files-found: ignore

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@stable
      - name: Install audit tools
        run: cargo install cargo-audit cargo-deny --locked
      # `--deny warnings` makes a new unmaintained/unsound advisory fail the job.
      # The one accepted advisory is in both `audit.toml` and `deny.toml`; the
      # flag repeats it so the gate holds even on a `cargo-audit` build that does
      # not read the config file.
      - name: Advisory audit
        run: cargo audit --deny warnings --ignore RUSTSEC-2024-0449
      - name: Dependency policy
        run: cargo deny check

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate and verify the SBOM
        run: |
          mkdir -p dist
          python3 scripts/sbom.py --output dist/active-rpc.cdx.json
          python3 scripts/sbom.py --check dist/active-rpc.cdx.json
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: sbom
          path: dist/*.cdx.json

  api-surface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@nightly
      # The authoritative check: the resolved public API, not a text scan.
      - name: Generate rustdoc JSON
        run: cargo +nightly rustdoc --locked --lib --all-features -- -Zunstable-options --output-format json
      - name: No public secret or raw capability accessor
        run: python3 scripts/api_surface.py target/doc/active_rpc.json
  presentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - name: Install image reader
        run: python -m pip install --quiet pillow==12.3.0
      - name: README, theme-pair and logo integrity gate
        run: python scripts/check_presentation.py
  control-plane:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Control plane format
        run: cargo fmt --check
        working-directory: control-plane
      - name: Control plane tests
        run: cargo test --locked
        working-directory: control-plane
      - name: Control plane two-launch smoke
        run: python3 scripts/launch_check.py
        working-directory: control-plane
      - name: Control plane lint
        run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: control-plane

  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # End-to-end CLI contract: real peer, real capability, real transports
      # (tcp, connect, http2), refusals, pipelining and load generation.
      - name: CLI tests
        run: cargo test --locked
        working-directory: cli/active-rpc-cli
      - name: CLI lint
        run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: cli/active-rpc-cli


  facades:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate:
          - active-rpc-kernel
          - active-rpc-core
          - active-rpc-client
          - active-rpc-tools
          - active-rpc-transport
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@stable
      - name: Facade tests
        run: cargo test --manifest-path "facades/${{ matrix.crate }}/Cargo.toml"


name: Fuzz nightly

# Longer campaigns than the per-push job in CI. Failures upload the crashing
# input and the grown corpus so the next run starts ahead.
on:
  schedule:
    - cron: "27 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    # 16 targets x 7 minutes of campaign, plus checkout, apt, cargo-fuzz and the
    # builds. A job timeout cancels the run and GitHub skips the `always()`
    # upload, so the ceiling has to leave room for the whole matrix.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@2c76c034f9e32a5d6e2c104dc4df23a22476db04 # nightly, pinned 2026-11-07 (R-20 round 5, F11)
      - name: Install clang (libFuzzer runtime)
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Install cargo-fuzz
        # Pinned: an unpinned third-party install runs arbitrary new code with
        # the job token (R-20 round 3, L2).
        run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Campaign (seven minutes per target)
        env:
          FUZZ_SECONDS: "420"
        run: |
          targets=$(python3 - <<'PY'
          import pathlib, re
          text = pathlib.Path("fuzz/Cargo.toml").read_text()
          print("\n".join(re.findall(r'^name = "(fuzz_[a-z0-9_]+)"$', text, re.MULTILINE)))
          PY
          )
          if [ -z "$targets" ]; then
            echo "no fuzz targets found in fuzz/Cargo.toml"
            exit 1
          fi
          status=0
          for target in $targets; do
            echo "== $target =="
            cargo fuzz run "$target" -- \
              -max_total_time="$FUZZ_SECONDS" -max_len=65536 -print_final_stats=1 || status=1
          done
          exit "$status"
      - name: Upload artifacts and corpus
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: fuzz-nightly
          path: |
            fuzz/artifacts
            fuzz/corpus
          if-no-files-found: ignore
